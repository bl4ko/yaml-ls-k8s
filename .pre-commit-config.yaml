repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: go-test-unit
        name: go test (unit)
        entry: go test ./internal/...
        language: system
        pass_filenames: false
        types: [go]
      - id: go-test-e2e
        name: go test (e2e)
        entry: bash -c 'go build -o yaml-ls-k8s ./cmd/yaml-ls-k8s && go test ./internal/e2e/ -timeout 120s'
        language: system
        pass_filenames: false
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]
